<!doctype html>
<html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" href="styles.css" />
      <title>View Sign Ups</title>
      <style>
        body {
          font-family: "Verdana", sans-serif;
          padding: 20px;
          background-color: #F9E6E4;
        }
        .center {
          max-width: 1200px;
          margin: 0 auto;
        }
        h1 {
          text-align: center;
          color: #ffa3a9;
        }
        .club-selector {
          display: flex;
          justify-content: center;
          margin: 30px 0;
        }
        .club-dropdown {
          padding: 12px 20px;
          font-size: 16px;
          border-radius: 5px;
          border: 2px solid #f2c6c9;
          background-color: white;
          color: #e69ca1;
          font-family: "Verdana", sans-serif;
          cursor: pointer;
          min-width: 250px;
        }
        .club-dropdown:hover {
          border-color: #cc9599;
        }
        .table-container {
          margin-top: 30px;
          display: none;
        }
        .table-container.show {
          display: block;
        }
        .table-title {
          font-size: 20px;
          font-weight: bold;
          font-family: "Verdana", sans-serif;
          color: #c89797;
          margin-bottom: 15px;
          border-bottom: 2px solid #b47777;
          padding-bottom: 10px;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 15px;
        }
        th {
          background-color: #ffb0b5;
          font-family: "Verdana", sans-serif;
          color: white;
          padding: 12px;
          text-align: left;
          font-weight: bold;
          border: 1px solid #ddd;
        }
        td {
          padding: 10px;
          border: 1px solid #ddd;
          
        }
        tr {
          background-color: #ffffff;
          color:#ffb0b5;
        }
        tr:nth-child(even) {
          background-color: #ffffff;
        }
        tr:hover {
          background-color: #ffcace;
          color: white;
        }
        .no-signups {
          font-family: "Verdana", sans-serif;
          color: #ffb0b5;
          font-style: italic;
          padding: 20px;
          text-align: center;
        }
        .button-group {
          margin-top: 20px;
          text-align: center;
        }
        button.action-btn {
          padding: 10px 20px;
          margin: 5px;
          font-family: "Verdana", sans-serif;
          font-size: 16px;
          cursor: pointer;
          border: none;
          border-radius: 5px;
          background-color: #d88484;
          color: white;
        }
        button.action-btn:hover {
          background-color: #a36767;
        }
        .clear-btn {
          background-color: #bf8581;
        }
        .clear-btn:hover {
          background-color: #b66e69;
        }
      </style>
    </head>
    <body>
      <h1>Club Sign-Ups Report</h1>
      <div class="club-selector">
        <select
          class="club-dropdown"
          id="clubDropdown"
          onchange="handleClubSelect()"
        >
          <option value="">-- Select a Club --</option>
          <option value="all">All Clubs</option>
          <option value="gaming">Gaming Club</option>
          <option value="sports">Sports Club</option>
          <option value="music">Music Club</option>
          <option value="art">Arts Club</option>
          <option value="science">Sciences Club</option>
        </select>
      </div>

      <div class="table-container" id="tableContainer">
        <div class="table-title" id="tableTitle"></div>
        <div id="tableBody"></div>
      </div>

      <div class="button-group">
        <button
          class="action-btn"
          onclick="location.href = 'Q3_2GNaAyuyao.html'"
        >
          Back to Sign-Up Form
        </button>
        <button class="action-btn clear-btn" onclick="clearAllSignups()">
          Clear All Sign-Ups
        </button>
      </div>

      <script>
        const KEY = "signups";

        function getSignUps() {
          const signUps = localStorage.getItem(KEY);
          return signUps ? JSON.parse(signUps) : [];
        }

        function clearAllSignups() {
          if (
            confirm(
              "Are you sure you want to delete all sign-ups? This action cannot be undone.",
            )
          ) {
            localStorage.removeItem(KEY);
            document.getElementById("clubDropdown").value = "";
            document.getElementById("tableContainer").classList.remove("show");
          }
        }

        function handleClubSelect() {
          const selectedClub = document.getElementById("clubDropdown").value;

          if (!selectedClub) {
            document.getElementById("tableContainer").classList.remove("show");
            return;
          }

          displayTable(selectedClub);
        }

        function displayTable(clubKey) {
          const signups = getSignUps();
          let filteredSignups;
          let clubName;

          if (clubKey === "all") {
            filteredSignups = signups;
            clubName = "All Clubs";
          } else {
            filteredSignups = signups.filter(
              (signup) => signup.preferredClubs === clubKey,
            );
            clubName =
              clubKey.charAt(0).toUpperCase() + clubKey.slice(1) + " Club";
          }

          const tableContainer = document.getElementById("tableContainer");
          const tableTitle = document.getElementById("tableTitle");
          const tableBody = document.getElementById("tableBody");

          tableTitle.textContent = `${clubName} (${filteredSignups.length} Sign-Up/s)`;

          if (filteredSignups.length === 0) {
            tableBody.innerHTML =
              '<div class="no-signups">No sign-ups for this club yet.</div>';
          } else {
            let tableHtml = `
              <table>
                <thead>
                  <tr>
                    ${clubKey === "all" ? "<th>Club</th>" : ""}
                    <th>Student ID</th>
                    <th>Full Name</th>
                    <th>Birthday</th>
                    <th>Email</th>
                    <th>Mobile Phone</th>
                    <th>Grade Level</th>
                    <th>Type</th>
                    <th>Reason</th>
                  </tr>
                </thead>
                <tbody>
            `;

            filteredSignups.forEach((signup) => {
              tableHtml += `
                <tr>
                  ${clubKey === "all" ? `<td>${signup.preferredClubs.charAt(0).toUpperCase() + signup.preferredClubs.slice(1)}</td>` : ""}
                  <td>${signup.studentID}</td>
                  <td>${signup.fullName}</td>
                  <td>${signup.birthday}</td>
                  <td>${signup.email}</td>
                  <td>${signup.mobilePhone}</td>
                  <td>Grade ${signup.gradeLevel}</td>
                  <td>${signup.internOrExtern}</td>
                  <td>${signup.clubReason}</td>
                </tr>
              `;
            });

            tableHtml += `
                </tbody>
              </table>
            `;
            tableBody.innerHTML = tableHtml;
          }

          tableContainer.classList.add("show");
        }
      </script>
    </body>
  </html>
</html>
